    <circle cx="73" cy="84" r="46" fill="none" stroke="#234760" stroke-width="14"/>
    <path d="M73 38A46 46 0 0 1 117 95" fill="none" stroke="#ffb74d" stroke-width="14" stroke-linecap="round"/>
