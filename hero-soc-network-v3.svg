    <rect x="1070" y="178" width="660" height="469" rx="18" fill="#04111d" stroke="#4bb8ed" stroke-opacity="0.2"/>
  </g>

  <g clip-path="url(#globeClip)" fill="none" stroke="#57d7ff" filter="url(#glow)">
