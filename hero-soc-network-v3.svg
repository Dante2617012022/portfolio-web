      <rect x="169" y="94" width="24" height="50" rx="4"/><rect x="205" y="62" width="24" height="82" rx="4"/>
      <rect x="241" y="45" width="24" height="99" rx="4"/>
    </g>
  </g>

  <g transform="translate(1355 720)">
