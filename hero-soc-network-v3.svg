<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Centro de monitoreo SOC con mapa de red</title>
  <desc id="desc">Fondo oscuro con sala de monitoreo, mapa digital, nodos conectados y paneles de alertas en el sector derecho.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.48" stop-color="#07152b"/>
      <stop offset="1" stop-color="#071a27"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2741" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#04101d" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="46%" r="45%">
      <stop offset="0" stop-color="#20d3ff" stop-opacity="0.24"/>
      <stop offset="0.42" stop-color="#1677ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113451" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#06131f" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7ddfff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globeClip"><circle cx="1470" cy="470" r="250"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <path d="M0 830L1920 695V1080H0Z" fill="url(#floor)"/>
  <g opacity="0.18" stroke="#53c8ff" stroke-width="1">
    <path d="M0 910L1920 760"/><path d="M0 980L1920 820"/><path d="M140 1080L1110 745"/>
    <path d="M520 1080L1240 730"/><path d="M900 1080L1380 715"/><path d="M1320 1080L1540 700"/>
  </g>

  <g opacity="0.72">
