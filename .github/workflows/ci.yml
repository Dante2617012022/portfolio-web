name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate lint report
        id: lint
        shell: bash
        run: |
          set +e
          npx eslint src/PortfolioDante.jsx src/main.jsx --format json > lint-report.json
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: error

      - name: Fail on lint errors
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1

      - name: Build
        run: npm run build
