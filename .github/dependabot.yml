version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      frontend-tooling:
        patterns:
          - "@vitejs/*"
          - vite
          - framer-motion
          - gh-pages
          - "eslint-*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: globals
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-react-refresh
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      reviewed-actions:
        patterns:
          - "actions/*"
          - github/codeql-action
    labels:
      - dependencies
      - github-actions
