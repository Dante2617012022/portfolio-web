    <path d="M0 -131C48 -114 87 -105 128 -100V-8C128 82 75 156 0 190C-75 156 -128 82 -128 -8V-100C-87 -105 -48 -114 0 -131Z"
      fill="#0c2248" fill-opacity="0.72" stroke="#78c8ff" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M-49 5L-10 44L73 -52" fill="none" stroke="#7ee4ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1040 168)" opacity="0.72">
    <rect width="250" height="94" rx="18" fill="#091a37" stroke="#7db4ff" stroke-opacity="0.22"/>
    <circle cx="42" cy="47" r="18" fill="#56d6ff" opacity="0.18"/>
    <circle cx="42" cy="47" r="7" fill="#78ddff"/>
