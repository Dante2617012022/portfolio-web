    <rect x="76" y="51" width="92" height="8" rx="4" fill="#6d87d9" opacity="0.58"/>
  </g>

  <g transform="translate(1480 805)" opacity="0.74">
    <rect width="282" height="110" rx="20" fill="#100f2f" stroke="#a17cff" stroke-opacity="0.24"/>
    <g fill="#7acfff">
      <rect x="34" y="69" width="24" height="19" rx="4" opacity="0.40"/>
      <rect x="70" y="53" width="24" height="35" rx="4" opacity="0.52"/>
      <rect x="106" y="36" width="24" height="52" rx="4" opacity="0.70"/>
      <rect x="142" y="24" width="24" height="64" rx="4" opacity="0.82"/>
      <rect x="178" y="43" width="24" height="45" rx="4" opacity="0.58"/>
      <rect x="214" y="31" width="24" height="57" rx="4" opacity="0.76"/>
    </g>
  </g>

  <g opacity="0.25">
    <path d="M720 -40L1260 540" stroke="#72d5ff" stroke-width="2"/>
    <path d="M880 -30L1430 560" stroke="#8a70ff" stroke-width="2"/>
    <path d="M760 1080L1340 468" stroke="#72d5ff" stroke-width="2"/>
    <path d="M1010 1080L1580 475" stroke="#8a70ff" stroke-width="2"/>
  </g>

  <ellipse cx="1300" cy="520" rx="390" ry="330" fill="#4d74ff" opacity="0.055" filter="url(#soft)"/>
  <rect width="1920" height="1080" fill="#030711" opacity="0.08"/>
</svg>
