    <circle r="174" fill="none" stroke="#a56dff" stroke-opacity="0.14" stroke-width="2"/>
    <circle r="118" fill="none" stroke="#72d5ff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="5 10"/>
    <path d="M0 0L215 -106" stroke="#72d5ff" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M0 0L92 198" stroke="#a56dff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M0 0L-176 128" stroke="#5f7cff" stroke-opacity="0.42" stroke-width="3"/>
  </g>

  <g transform="translate(1318 500)" filter="url(#glow)">
    <path d="M0 -196C72 -171 130 -158 191 -151V-16C191 118 111 226 0 274C-111 226 -191 118 -191 -16V-151C-130 -158 -72 -171 0 -196Z"
