<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Fondo abstracto de ciberseguridad con escudo digital</title>
  <desc id="desc">Composición oscura con escudo, radar, conexiones y luces azules y violetas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.52" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#120d2f"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="77%" cy="49%" r="46%">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#2968ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#050b18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72d5ff"/>
      <stop offset="0.52" stop-color="#5f7cff"/>
      <stop offset="1" stop-color="#a56dff"/>
    </linearGradient>
    <pattern id="microGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7e9fdc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#rightGlow)"/>
  <rect width="1920" height="1080" fill="url(#microGrid)"/>

  <g opacity="0.22" fill="none" stroke="#75a7ff" stroke-width="2">
    <path d="M925 150L1120 270L1310 185L1518 320L1762 205"/>
    <path d="M865 860L1084 740L1272 830L1496 690L1775 805"/>
    <path d="M1045 102L1180 430L1455 255L1688 520"/>
    <path d="M1000 980L1222 642L1508 880L1768 590"/>
  </g>

  <g fill="#8fc8ff" opacity="0.85" filter="url(#glow)">
    <circle cx="925" cy="150" r="5"/><circle cx="1120" cy="270" r="6"/>
    <circle cx="1310" cy="185" r="5"/><circle cx="1518" cy="320" r="7"/>
    <circle cx="1762" cy="205" r="5"/><circle cx="865" cy="860" r="5"/>
    <circle cx="1084" cy="740" r="7"/><circle cx="1272" cy="830" r="5"/>
    <circle cx="1496" cy="690" r="6"/><circle cx="1775" cy="805" r="5"/>
  </g>

