<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Centro de operaciones de seguridad abstracto</title>
  <desc id="desc">Fondo azul oscuro con paneles de monitoreo, red de nodos y líneas de datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061126"/>
      <stop offset="0.5" stop-color="#0a1f42"/>
      <stop offset="1" stop-color="#08152d"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="46%" r="54%">
      <stop offset="0" stop-color="#1d7cff" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#1263d8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#061126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7db7ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15345f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0a1b38" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

